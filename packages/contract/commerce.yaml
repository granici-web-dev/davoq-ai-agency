# Коммерческие условия, общие для всех агентов.
#
# Здесь то, что НЕ является свойством отдельного агента. Проверка простая:
# если значение нельзя назвать, глядя только на одного агента, ему место
# тут, а не в его манифесте.
#
# Плата за заведение — ровно такой случай. Она зависит от того, какой агент
# по счёту у ЭТОГО клиента: первый стоит одного, второй дешевле. Манифест
# конфигуратора не знает и не может знать, купили ли уже чатбот, — значит
# и ответить на вопрос «сколько за заведение» он не может.
schema: 1

# Годовая оплата: минус двадцать процентов от двенадцати месячных.
#
# Хранится долей, а сами годовые цены считаются. Держать их числами значило
# бы завести двенадцать значений, которые обязаны согласовываться с двенадцатью
# месячными, — и разойтись при первой же правке цены.
annual:
  discount: 0.20

# Заведение. Разово, скидки на него не распространяются.
setup:
  first: 290
  next: 190
  # Пилотные клиенты в своей нише: заводим бесплатно, потому что первыми
  # они платят не деньгами, а тем, что на них обкатывается ниша.
  pilot: 0

# Скидка за несколько агентов. Складывается с годовой.
volume:
  - agents: 2
    discount: 0.10
  - agents: 3
    discount: 0.20
