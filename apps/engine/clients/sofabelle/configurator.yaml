# Конфигуратор: слой клиента поверх ниши `furniture`.
#
# Здесь только то, что у этого клиента правда своё. Порядок блоков, тексты
# по локалям и юртекст приходят из `src/verticals/furniture/configurator.yaml`
# и обновляются вместе с ним.
schema: 1

offer:
  hero:
    # Снимок с их же сайта: тёплый орех попадает в акцент бланка #706155.
    # Кадр подрезан под пропорции полосы, чтобы обрезка не решалась на рендере.
    image: assets/hero.jpg
    # Марка идёт вектором и берёт цвет от блока: на обложке она белая,
    # в реквизитах была бы тёмной — из одного и того же файла.
    logo: assets/logo.svg

  theme:
    # Цвета сняты с их собственной оферты: плашки и заливки #706155,
    # фон листа #dad2c8. Белый лист у них не используется нигде.
    colors:
      accent: '#706155'
      page: '#dad2c8'
      text: '#3d342c'
      muted: '#6b5e53'
      line: '#c4b8aa'
      onAccent: '#ffffff'

  text:
    ro:
      # Реквизитов (CUI, адрес) здесь нет намеренно: их нет и в собственной
      # оферте клиента. «Anexa 1» — приложение к договору, а не фискальный
      # документ; CUI живёт в договоре и на фактуре. Блок `header` у ниши
      # `furniture` поэтому не включён, а марка и контакты стоят на обложке.
      hero:
        title: 'ANEXA 1'
        numberLabel: 'OFERTA NR.'
        lines:
          - sofabelle.ro
          - '+40 720 111 225'
      notes:
        heading: Atenție
        # Условия перенесены из их оферты дословно. Две опечатки источника
        # («MINUPULARE», «APARTMANET») исправлены — в документе, который
        # печатается сам, опечатка перестаёт быть разовой.
        items:
          - 'Livrare în zona Brașov — 150 lei'
          - 'Manipulare până la casă sol sau apartament parter — 150 lei'
          - 'Pentru fiecare etaj ridicat fără lift — +50 lei per etaj'
          - 'Pentru ridicare la etaj cu lift manipularea va fi 150 lei'
          - 'Livrare în raza de 25–100 km — 400 lei'
          - 'Livrare în raza de 100–200 km — 600 lei'
          - 'Livrare în raza de 200–250 km — 800 lei'
          - 'Livrare în raza de 250–300 km — 1000 lei'
          - 'Livrare în raza de 300–350 km — 1200 lei'
          - 'Livrare în raza de 350–450 km — 1500 lei'
      footer: SofaBelle SRL · sofabelle.ro
