# Конфигуратор: слой ниши «кастомная мягкая мебель».
#
# Всё, что одинаково у любого мебельного клиента. Клиент переопределяет отсюда
# по ключу только то, что у него правда своё: марку, реквизиты, палитру,
# формулировки. Скопировать этот файл целиком ради двух правок — значит
# не иметь слоя ниши вовсе.
#
# В фазе 2 здесь только бланк оферты. Флоу и промпт агента добавляются
# в фазе 3 теми же двумя ключами: `flow:` и `agent:`.
schema: 1
id: furniture

offer:
  # Порядок блоков ниши. Типы блоков задаёт движок; свой тип завести нельзя —
  # это был бы код на клиента, то есть ровно то, чего мы избегаем.
  # Порядок как в настоящей оферте мебельщика: обложка с фото и номером,
  # позиции, цена, характеристики изделия, условия доставки, материалы.
  # Отдельного блока «кому» нет намеренно — имя заказчика стоит на обложке,
  # ровно как в бланке пилота.
  blocks: [hero, meta, items, pricing, specs, notes, gallery, legal, footer]

  currency:
    code: RON

  text:
    ro:
      hero:
        title: Ofertă
        numberLabel: 'OFERTA NR.'
      meta:
        # Номер печатается на обложке — здесь он не нужен.
        title: Ofertă de preț
        date: Data
        validUntil: Valabilă până la
        consultant: Consilier
      customer:
        heading: Client
        name: Nume
        phone: Telefon
        email: Email
      items:
        heading: Produse și servicii
        product: Produs sau serviciu
        quantity: Cant.
        unitPrice: Preț unitar
        discount: Reducere
        total: Total
      pricing:
        heading: Preț
        subtotal: Subtotal
        discount: Reducere
        vat: TVA
        total: Total
        # Цена конфигурации мебели зависит от замера и ткани на складе.
        # Оферта без этой оговорки читается как твёрдое обязательство.
        disclaimer: >-
          Prețul este estimativ și se confirmă după măsurătoare și verificarea
          disponibilității țesăturii. Oferta nu constituie contract.
      specs:
        heading: Descrierea produsului
        label: Caracteristică
        value: Valoare
      notes:
        heading: Atenție
        # Условия доставки и подъёма у каждого клиента свои — здесь пусто
        # намеренно: выдуманный прайс в оферте хуже отсутствующего.
        items: []
      gallery:
        heading: Compoziție
      legal: file:offer/legal.ro.md

    ru:
      hero: { title: Коммерческое предложение, numberLabel: '№' }
      meta: { title: Коммерческое предложение, date: Дата, validUntil: Действительно до, consultant: Менеджер }
      customer: { heading: Клиент, name: Имя, phone: Телефон, email: Email }
      items:
        heading: Товары и услуги
        product: Наименование
        quantity: Кол-во
        unitPrice: Цена
        discount: Скидка
        total: Сумма
      pricing:
        heading: Цена
        subtotal: Подытог
        discount: Скидка
        vat: НДС
        total: Итого
        disclaimer: >-
          Цена предварительная и подтверждается после замера и проверки наличия
          ткани. Предложение не является договором.
      specs: { heading: Характеристики изделия, label: Параметр, value: Значение }
      notes: { heading: Условия, items: [] }
      gallery: { heading: Материалы }

    en:
      hero: { title: Quotation, numberLabel: 'OFFER NO.' }
      meta: { title: Quotation, date: Date, validUntil: Valid until, consultant: Consultant }
      customer: { heading: Customer, name: Name, phone: Phone, email: Email }
      items:
        heading: Products and services
        product: Product or service
        quantity: Qty
        unitPrice: Unit price
        discount: Discount
        total: Total
      pricing:
        heading: Price
        subtotal: Subtotal
        discount: Discount
        vat: VAT
        total: Total
        disclaimer: >-
          The price is an estimate and is confirmed after measurement and fabric
          availability check. This quotation is not a contract.
      specs: { heading: Product description, label: Property, value: Value }
      notes: { heading: Please note, items: [] }
      gallery: { heading: Materials }
