# Манифест продукта: чат-бот на сайте.
#
# Кода отдельным каталогом у него нет и не будет: чат-бот — это сам движок,
# его разговор, база знаний и виджет. Манифест всё равно нужен, и именно
# поэтому: пока его не было, каталог сайта отвечал за статус чатбота
# в одиночку, и проверить это было нечем.
schema: 1
id: chatbot
version: 1

# Работает и продаётся — единственный, про кого это верно без оговорок.
status: shipped

feature: chatbot
plan: starter

# Работает в любой заведённой нише: сценарий приходит слоем ниши, а не кодом.
verticals:
  - furniture

# TODO(себестоимость): против замера не сверено. Две тысячи разговоров
# в Pro — это разговоры, а разговоры считаются в токенах: при пяти с половиной
# тысячах входных на сообщение и десяти сообщениях на разговор выходит
# заметная величина. Прогнать `npm run cost -- --plans`.

# ── Вилки ──
#
# Pro НИЧЕГО не отбирает у Basic: на карточке он идёт строкой «всё из Basic»
# плюс свои. Иначе список Basic пришлось бы читать как перечень того, чего
# в нём нет, — и продавать дорогую вилку тем, что дешёвая чего-то лишена.
#
# Поэтому в `pro.features` только НАСТОЯЩИЕ надбавки: объём, свой сценарий
# вместо отраслевого, второй язык. Возможности самого агента лежат в Basic
# и достаются обеим вилкам.
#
# Ключи в `basic.features` — те же, что у блока возможностей на странице
# агента. Текст к ним уже написан и принят; заводить рядом второй, про то
# же самое, значило бы завести копию, которая разойдётся.
tiers:
  basic:
    price: 149
    limits:
      conversations: 500
    features:
      - always
      - sources
      - qualify
      - portal
  pro:
    price: 249
    limits:
      conversations: 2000
    features:
      - scenarioCustom
      - secondLanguage
