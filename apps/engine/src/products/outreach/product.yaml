# Манифест продукта: outreach — холодные письма.
#
# Как и аналитик, этот агент живёт не в движке: отдельный сервис
# (apps/outreach) со своей схемой в общей базе, своим планировщиком и своим
# кабинетом. Манифест всё равно здесь, потому что контракт описывает не
# устройство, а обещание: что витрина вправе показывать и под каким статусом.
#
# ── Про двойное назначение ──
#
# Строится он в первую очередь ДЛЯ СЕБЯ: искать клиентов Davoq и вербовать
# партнёров. То, что он одновременно заведён продуктом, — решение осознанное:
# инструмент, которым мы ищем клиентов сами, продаётся тем, кто ищет своих.
# Но продавать его можно будет не раньше, чем он отработает на нас: обещание,
# за которым нет собственного опыта, — это чужой риск за наш счёт.
schema: 1
id: outreach

# Версия ОБЕЩАНИЯ. Растёт, когда меняется то, что продукт делает для клиента.
version: 1

# planned — витрина показывает «в curând», кнопки покупки нет.
#
# Кода пока нет вовсе: заведены схема и план модулей. Ставить что-либо кроме
# planned было бы обещанием, за которым не стоит ни строки.
status: planned

# Ключ в `PlanFeatures` из `engine/plans.ts`. Генератор проверяет, что такой
# ключ там есть: манифест не должен уметь сослаться на несуществующую
# возможность.
feature: outreach

# Тарифов нет намеренно: `tiers` обязателен только у shipped. Заводить цену
# раньше, чем продукт можно включить клиенту, — та самая ошибка, из-за
# которой цифры на витрине начинают жить отдельно от того, что работает.

# Ниши, где продукт обкатан на живых клиентах. Пусто: он ещё не обкатан
# даже на нас.
verticals: []
