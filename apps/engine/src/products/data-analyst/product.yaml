# Манифест продукта: аналитик продаж и маркетинга.
#
# У этого агента манифест стоит особняком, и это стоит прочитать до того,
# как менять здесь цифры.
#
# Остальные шесть продуктов — части одного движка: общий Postgres, общий
# виджет, общий TypeScript. Этот — отдельная система на Python/FastAPI со
# своей базой, своими фоновыми задачами и своим кабинетом. Он читает CRM,
# считает воронку и раз в сутки пишет разбор через Claude.
#
# Манифест всё равно живёт здесь, а не рядом с тем кодом. Контракт описывает
# не устройство, а обещание: что витрина вправе продавать и под каким
# статусом. Обещание у всех семи одной природы, даже когда код разный.
schema: 1
id: data-analyst

# Версия ОБЕЩАНИЯ. Растёт, когда меняется то, что продукт делает для
# клиента, а не когда меняется код.
version: 1

# planned — витрина показывает «в curând», кнопки покупки нет.
#
# Именно planned, а не shipped, и это не занижение. Продукт работает: он
# считает живые данные пилотного клиента, и разбор, который он написал по
# ним, сошёлся с базой до последней цифры. Но он не развёрнут — нет домена,
# сертификата, резервных копий и наблюдаемости, и подписку на него продать
# нельзя. shipped означает «продаётся поштучно, цена есть на витрине»;
# до этого ему остаётся девятая фаза.
status: planned

# Ключ в `PlanFeatures` из `engine/plans.ts`. Генератор проверяет, что такой
# ключ там есть: манифест не должен уметь сослаться на несуществующую
# возможность.
feature: analytics

# Тарифов нет намеренно.
#
# `tiers` обязателен только у shipped. Заводить цену раньше, чем продукт
# можно включить клиенту, — это ровно та ошибка, из-за которой конфигуратор
# год простоял «в curând», пока движок его считал и выставлял в счёт, только
# наоборот. Цифры из старой спецификации продукта (49/149/299 €) написаны
# под трёхступенчатую модель, которой на витрине больше нет, и переносить
# их сюда механически нельзя.

# Ниши, где продукт обкатан на живых клиентах.
#
# Пусто — и это не описка. Пилот считает данные мебельного производителя,
# но «обкатан» здесь значит «работает у клиента в проде», а он не в проде.
# Появится развёртывание — появится и строка.
verticals: []
