# Манифест продукта: телефонный агент.
#
# Каталог с одним файлом и без единой строки кода — так агент и заводится.
# Сначала он объявляет, чем будет, и попадает в каталог со статусом
# `planned`; код ложится сюда же позже, рядом с манифестом.
#
# Порядок именно такой, а не наоборот. Витрина уже обещает голосового
# агента — он есть и в каталоге сайта, и в списке пакетов. Пока обещание
# не было ничем подкреплено, единственным способом узнать, что за ним
# ничего нет, было пойти и посмотреть в `src/products`. Теперь это видно
# из контракта, а `status` не даст показать цену там, где нечего продавать.
schema: 1
id: voice-assistant
version: 1

# Кода нет вовсе. Не `beta`: beta — это работает, но не продаётся.
status: planned

# Ключ заведён в `PlanFeatures` вместе с этим манифестом и выключен везде,
# кроме enterprise, — там он стоит по общему для тарифа правилу «право
# на всё», а не потому, что что-то работает.
feature: voice

# `plan` не указан намеренно: в старой платформенной лестнице голосового
# не было никогда, он рождается уже в поагентной продаже. Выдуманный тариф
# здесь был бы хуже пустоты.

# Ни в одной нише не обкатан — обкатывать пока нечего.
verticals: []

# Вилок нет: цена появится, когда появится продукт. Сборка следит, чтобы
# `planned` без цен не выдал себя за продаваемого.
