# Манифест продукта: конфигуратор.
#
# Чем продукт ЯВЛЯЕТСЯ — в отличие от кода рядом, который описывает, как он
# работает. Двадцать семь файлов в этом каталоге не отвечали на вопрос
# «готов ли конфигуратор и с какого тарифа он продаётся»; ответ жил в голове
# и в двух несогласованных местах — в `plans.ts` и в каталоге сайта.
#
# Отсюда его читает генератор контракта (`packages/contract`), и обе стороны —
# движок и сайт — получают одно и то же значение. У ниш такой манифест уже
# был (`vertical.yaml`), у продуктов не было.
schema: 1
id: configurator

# Версия ОБЕЩАНИЯ, а не кода.
#
# Растёт, когда меняется то, что продукт делает для клиента: появился шаг,
# исчезло ограничение, поменялся результат. Рефакторинг её не трогает.
#
# Тексты сайта будут объявлять, под какую версию они написаны. Подняли
# здесь — сборка сайта падает, пока тексты не перепишут. Это единственный
# способ не дать описанию отстать от продукта: следить за этим руками
# уже пробовали, и конфигуратор год простоял на сайте как «в curând».
version: 1

# planned — заведён, кода нет. beta — работает, но поштучно не продаётся.
# shipped — продаётся поштучно, цена есть на витрине.
#
# Сейчас beta, и это не про готовность кода: конфигуратор работает и уже
# выставляется в счёт внутри старого тарифа `pro`. Но поагентной продажи,
# под которую разворачивается модель, ещё нет — цены посчитаны не были.
# Поставить здесь `shipped` без блока `tiers` сборка не даст, и правильно:
# «продаётся» без цены — это обещание, которое нечем закрыть.
status: beta

# Ключ в `PlanFeatures` из `engine/plans.ts`. Генератор проверяет, что такой
# ключ там правда есть: манифест не должен уметь сослаться на несуществующую
# возможность.
feature: configurator

# Минимальный тариф, с которого продукт доступен. Сверен с `plans.ts`:
# `configurator: true` впервые появляется у `pro`.
#
# TODO(тарифы): у движка лестница starter/pro/business, у сайта start/growth/
# platform, и они не сводятся. Пока лестницы не сведены в одну, это значение
# верно только для движка.
plan: pro

# Ниши, где продукт обкатан на живых клиентах. Пусто — значит нигде.
verticals:
  - furniture

# ── Вилки ──
#
# Агент продаётся сам по себе, а не в составе платформенного тарифа: разным
# нишам нужны разные агенты, и заставлять клинику платить за конфигуратор
# мебели, чтобы получить запись на приём, — способ не продать ни того,
# ни другого.
#
# Вилки две, третья — Individual — общая для всех агентов и живёт в контракте
# один раз, а не переписывается в каждый манифест.
#
# `limits` — числа, их проверяет сборка. `features` — ключи, текст к ним
# лежит в messages сайта на двух языках; генератор следит, чтобы текст
# нашёлся для каждого ключа. Забыли перевод — сборка падает.
#
# TODO(цены): чисел пока нет, и выдумывать их нельзя — неверная цена здесь
# станет неверной ценой в коммерческом предложении. Считать надо от
# `npm run cost -- --plans`, который меряет расход по живым диалогам.
# Пока блока `tiers` нет, сайт покажет агента без цены.
