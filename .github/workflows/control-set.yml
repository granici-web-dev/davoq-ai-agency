# Контрольный набор: пятнадцать вопросов боту через настоящий HTTP.
#
# Это не тест кода, а критерий приёмки продукта: находит ли поиск нужное,
# не течёт ли язык инструкций в ответ, не выдумывается ли цена на то, чего
# нет в прайсе, доезжает ли заявка до базы. Проверить это можно только
# обращением к модели, поэтому прогон стоит денег — измерено: пятнадцать
# обращений к Haiku плюс три вложения при заведении корпуса.
#
# ПОЧЕМУ НЕ НА КАЖДЫЙ PUSH. Ответ модели недетерминирован: один и тот же
# вопрос дважды даёт разные слова, и набор проверяет смысл, а не строку.
# Гейт, который иногда краснеет не по вине коммита, люди перестают читать —
# в ci.yml это уже записано про красный CI. К тому же pull request из форка
# к секретам доступа не имеет, то есть на форках он падал бы всегда.
#
# Поэтому два повода:
#   · ночью — ловит снос со стороны модели, которого не вызвал ни один наш
#     коммит; на тихой неделе это единственный способ узнать;
#   · руками — перед выкладкой, и тогда же можно взять подмножество случаев.
#
# ЕСЛИ КЛЮЧЕЙ НЕТ, прогон падает первым шагом с внятным сообщением, а не
# пятнадцатью отказами Bedrock подряд. Молча зеленеть он не будет: набор,
# который прошёл, ничего не спросив, — худший вид гейта.
name: Контрольный набор

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Случаи через запятую, например warranty,lead_time (пусто — все пятнадцать)"
        required: false
        type: string
  schedule:
    # 03:17 UTC. Минуты не круглые намеренно: в ноль минут в очередь
    # GitHub встаёт весь мир, и запуск ждёт дольше, чем работает.
    - cron: "17 3 * * *"

jobs:
  control-set:
    name: Пятнадцать вопросов боту
    runs-on: ubuntu-latest

    services:
      # Тот же образ, что в docker-compose: набор должен идти в CI и на
      # машине разработчика одинаково, а расхождение версий postgres — это
      # ровно тот случай, когда «у меня работает».
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: assistwidget
          POSTGRES_USER: app
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d assistwidget"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Очередь загрузки создаёт клиента на этапе загрузки модуля. Заведение
      # корпуса идёт мимо очереди, но подключение всё равно открывается,
      # и без redis лог тонет в попытках переподключения.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      # Две роли, а не одна. Владелец `app` создан образом и умеет менять
      # схему; рабочая `assistwidget_app` заводится миграцией 002 и не умеет
      # ничего, кроме чтения и записи строк. Изоляция клиентов держится
      # именно на этом: под владельцем RLS не применяется, и набор,
      # прогнанный под ним, проверял бы движок в конфигурации, которой
      # нигде нет. В .env.example оба адреса совпадают — это удобство
      # разработки, и повторять его здесь незачем.
      DATABASE_ADMIN_URL: postgres://app:dev@localhost:5432/assistwidget
      DATABASE_URL: postgres://assistwidget_app:dev@localhost:5432/assistwidget
      REDIS_URL: redis://localhost:6379

      PORT: "3779"
      BASE: http://localhost:3779
      PUBLIC_BASE_URL: http://localhost:3779

      # Не секреты: это идентификаторы моделей, они же в .env.example.
      # Префикс eu. — это inference profile, а не foundation model: по
      # прямому id новые модели Anthropic на Bedrock не вызываются.
      AWS_REGION: eu-central-1
      MODEL_BASE: eu.anthropic.claude-haiku-4-5-20251001-v1:0
      MODEL_PREMIUM: eu.anthropic.claude-sonnet-4-5-20250929-v1:0
      EMBEDDING_MODEL: amazon.titan-embed-text-v2:0

      # Ключи от Bedrock. Права им нужны ровно те, что в
      # infra/bedrock-policy.json: два действия на вызов модели и четыре
      # на диагностику. Ключ с правами шире этого здесь держать незачем.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      # Закреплено по хешу, а не по метке: метку владелец действия может
      # передвинуть на любой коммит, и наш CI выполнит его без единой
      # правки у нас. Те же хеши, что в ci.yml.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Ключи на месте
        # Первым шагом и до установки зависимостей: без ключей всё
        # последующее — три минуты работы ради пятнадцати отказов 403.
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Нет секретов AWS_ACCESS_KEY_ID и AWS_SECRET_ACCESS_KEY."
            echo "Набор обращается к Bedrock: без ключей проверять нечем."
            echo "Права для ключа — infra/bedrock-policy.json."
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать контракт
        # `dist/` контракта не в репозитории, а движок разрешает
        # `@assistwidget/contract` именно туда. Без этого шага сервер
        # не поднимется — то же самое записано в ci.yml.
        run: npm run compile -w @assistwidget/contract

      - name: Ключ шифрования секретов
        # Коннекторы набор не трогает, но модуль секретов требует ключ
        # правильной длины при обращении. Он одноразовый и живёт минуты:
        # хранить такое в секретах репозитория незачем, а вписать
        # константу значило бы завести в репозитории ключ шифрования.
        run: echo "SECRETS_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Миграции
        working-directory: apps/engine
        run: npm run migrate

      - name: Завести корпус
        # Вымышленный клиент «Etalon Mobilă» из clients/control. Факты в его
        # материалах те же, что у пилота, по смыслу и по числам — поэтому
        # один и тот же набор случаев проходит против обоих, и чужие данные
        # в CI не попадают.
        working-directory: apps/engine
        run: npm run seed:control

      - name: Поднять движок
        working-directory: apps/engine
        run: |
          # Двоичный файл из корня, а не через npx: npx при промахе идёт
          # в сеть и ставит пакет, то есть прогон зависел бы от того,
          # что в тот момент лежит в реестре.
          ../../node_modules/.bin/tsx src/engine/api/server.ts > /tmp/engine.log 2>&1 &
          echo $! > /tmp/engine.pid
          # Ждём признак, а не секунды: отсчёт по часам врёт «готово»
          # ровно тогда, когда сервер не поднялся.
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${PORT}/health" > /dev/null; then
              echo "движок ответил за ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Движок не ответил на /health за 60 секунд."
          tail -50 /tmp/engine.log
          exit 1

      - name: Контрольный набор
        working-directory: apps/engine
        # Подмножество приходит через окружение, а не подстановкой в текст
        # команды: `${{ }}` разворачивается ДО запуска оболочки, и значение
        # с кавычкой внутри стало бы не аргументом, а второй командой.
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            npm run test:control -- --only "$ONLY"
          else
            npm run test:control
          fi

      - name: Лог движка
        # Только при провале и всегда: упавший случай печатает ответ бота,
        # но причина «HTTP 500» видна не в нём, а здесь.
        if: failure()
        run: tail -200 /tmp/engine.log || true
