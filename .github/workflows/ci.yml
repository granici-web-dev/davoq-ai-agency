# Проверки движка, сайта и контракта.
#
# Здесь нет шага с базой: почти все проверки движка (`test:isolation`,
# `test:onboarding`, `test:promo` и прочие с `--env-file=.env`) требуют
# postgres с pgvector и настоящих ключей. Они остаются ручными, и это
# записано вслух, потому что гейт, умалчивающий о том, чего он не проверяет,
# хуже отсутствующего.
#
# Контрольный набор (`test:control`) сюда не поднят намеренно, хотя корпус
# у него теперь воспроизводимый (`npm run seed:control`) и запускается он на
# любой машине, а не на одной. Ему нужны ключи Bedrock, и каждый прогон —
# это пятнадцать обращений к модели за настоящие деньги на каждый push.
# Он остаётся ручным критерием приёмки: перед выкладкой, а не перед коммитом.
#
# Что здесь есть — девять проверок движка, которым база не нужна: язык,
# права по агентам, защита от SSRF, оплата, вебхук, оферта, конфигуратор,
# расчёт цены и страница на месте снесённой панели.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Контракт, типы, линтер, тесты без базы, сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # package.json требует >=22.
          node-version: "24"
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Контракт совпадает с манифестами
        # Цены и состав пакетов выводятся из манифестов продуктов. Правка
        # манифеста без пересборки контракта разводит сайт и движок в разные
        # стороны — сайт покажет одну цену, счёт выставится по другой.
        run: npm run contract:check

      - name: Собрать контракт
        # `dist/` контракта не в репозитории, а `@assistwidget/contract`
        # разрешается именно туда: без этого шага движок и сайт не находят
        # ни объявлений типов, ни самого модуля. На машине разработчика dist
        # оставался от прошлых сборок, поэтому шага и не было — первый прогон
        # в чистой выкладке это и показал.
        run: npm run compile -w @assistwidget/contract

      - name: Линтер сайта
        run: npm run lint -w @assistwidget/site

      - name: Тесты движка без базы
        working-directory: apps/engine
        run: |
          set -e
          for t in language entitlements ssrf billing webhook offer configurator quote moved; do
            echo "── $t ──"
            npm run -s "test:$t"
          done

      - name: Сборка
        run: npm run build

      - name: Типы
        # После сборки, а не до неё. `next-env.d.ts` не хранится в репозитории
        # и вдобавок ссылается на `.next/types/`: объявления для импортов
        # изображений и типизированных маршрутов Next создаёт сам во время
        # сборки. До неё `tsc` не находит ни `.webp`, ни маршрутов.
        run: npm run typecheck
